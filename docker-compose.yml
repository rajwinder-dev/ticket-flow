services:
  postgres:
    image: postgres:15
    restart: always
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5433:5432"
    networks:
      - prisma-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 2s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: postgres -c listen_addresses='*'
    logging:
      options:
        max-size: "10m"
        max-file: "3"
  backend:
    build:
      context: .
      target: backend
    image: rajwindersxxx/ticket-management:backend
    # command: tail -f /dev/null
    env_file:
      - .env
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://dev_app_user:dev_password@postgres:5432/postgres
      - DIRECT_URL=postgresql://postgres:postgres@postgres:5432/postgres
    command: sh -c "pnpm run setup:db && pnpm run start"
    healthcheck:
      test: [
          "CMD-SHELL",
          'node -e ''require("http").get("http://localhost:3000", (r) =>
          process.exit(r.statusCode === 200 ? 0 : 1))''',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - prisma-network
  frontend:
    build:
      context: .
      target: frontend
    image: rajwindersxxx/ticket-management:frontend
    ports:
      - "80:80"

    depends_on:
      backend:
        condition: service_healthy
    networks:
      - prisma-network
networks:
  prisma-network:
volumes:
  postgres_data:
