name: API Integration Tests

on:
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        node-version: [20]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb

        ports:
          - 5488:5432
        options: >-
          --health-cmd="pg_isready -U testuser" --health-interval=10s
          --health-timeout=5s --health-retries=5

    env:
      DATABASE_URL: postgres://testuser:testpass@localhost:5488/testdb
      NODE_ENV: test
      ENCRYPTION_KEY: randome-key-1
      ACCESS_SECRET: ramdom-key-2
      REFRESH_SECRET: random-key-3
    steps:
       - uses: actions/checkout@v4
       - name: Install pnpm
         uses: pnpm/action-setup@v4
         with:
          version: 10
       - name: Use Node.js ${{ matrix.node-version }}
         uses: actions/setup-node@v4
         with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
       - name: Install dependencies
         run: pnpm install
       - name: Generate Prisma Client
         run: pnpm --filter backend exec prisma generate

       - name: Run migrations
         run: pnpm --filter backend exec prisma migrate deploy
       - name: Run tests
         run: pnpm --filter backend test
