info:
  name: get all members
  type: http
  seq: 1

http:
  method: GET
  url: "{{url}}/api/v1/member?limit=100"
  params:
    - name: limit
      value: "100"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const response = res.getBody()
        console.log(response.data.map(item => item.id))

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
