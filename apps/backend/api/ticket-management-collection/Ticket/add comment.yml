info:
  name: add comment
  type: http
  seq: 8

http:
  method: POST
  url: "{{url}}/api/v1/ticket/:id/comment"
  params:
    - name: id
      value: "{{ticketId}}"
      type: path
  body:
    type: json
    data: |-
      {
        "comment": "this is the commet from owner "
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
