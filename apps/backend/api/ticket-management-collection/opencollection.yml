opencollection: 1.0.0

info:
  name: ticket-management
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  headers:
    - name: x-organization-id
      value: "{{organizationId}}"
  auth:
    type: bearer
    token: "{{accessToken}}"
  scripts:
    - type: after-response
      code: |-
        console.log("---- ENV VARIABLES AFTER ----");
        console.log("url: " + bru.getEnvVar("url"))
        console.log("accesstoken: " + bru.getEnvVar("accessToken"))
        console.log("organizationId: " + bru.getEnvVar("organizationId"))
        console.log("queueGroupId: " + bru.getEnvVar("queueGroupId"))
        console.log("queueId: " + bru.getEnvVar("queueId"))
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
    presets:
      request:
        type: http
