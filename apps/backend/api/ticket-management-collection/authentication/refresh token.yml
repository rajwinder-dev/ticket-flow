info:
  name: "refresh token "
  type: http
  seq: 5

http:
  method: GET
  url: "{{url}}/api/v1/auth/refresh-token"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody()
        bru.setEnvVar("accessToken", body.data.accessToken)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
