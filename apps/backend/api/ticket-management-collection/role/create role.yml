info:
  name: create role
  type: http
  seq: 2

http:
  method: POST
  url: "{{url}}/api/v1/role"
  body:
    type: json
    data: |-
      {
        "name": "guest",
        "description": "this is guest role",
        "permissions": {
          "user": [
            "view",
            "assign_ticket"
          ],
          "category": [
            "create",
            "edit",
            "delete",
            "view"
          ]
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
