info:
  name: get organizations
  type: http
  seq: 1

http:
  method: GET
  url: "{{url}}/api/v1/org/me"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody()
        bru.setEnvVar("organizationId", body.data[0].id,{ persist: true })

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
