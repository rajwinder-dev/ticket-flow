info:
  name: get queues
  type: http
  seq: 2

http:
  method: GET
  url: "{{url}}/api/v1/queue/:id/group"
  params:
    - name: id
      value: "{{queueGroupId}}"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const response = res.getBody()
        bru.setEnvVar("queueId", response.data[0].id, { persist: true })

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
